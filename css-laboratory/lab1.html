        <!-- REFLECTION -->

        <!-- What is the difference between inline, internal, and external CSS? -->
        <!-- ANSWER: 
        Inline CSS: CSS is written directly inside an HTML element using the style attribute. 
        Internal CSS: CSS is written inside the <style> tag in the HTML document. 
        External CSS: CSS is written in a separate .css file and linked to the HTML document.  -->

        <!-- Which method would you use for a website with multiple pages? Explain why. -->
        <!-- ANSWER: 
        I would use External CSS for a website with multiple pages because one CSS file can style all the pages. It makes the website easier to maintain, organize, and update.   -->
