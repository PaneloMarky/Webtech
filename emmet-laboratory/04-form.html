<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04-form</title>
</head>
<body>
    <input type="text" name="" id=""> 
    <input type="email" name="" id="">
    <input type="password" name="" id="">
    <input type="checkbox" name="" id="">
    <input type="radio" name="" id="">
    <input type="submit" value="">
    <hr>

    <label for="studentid">Student ID:</label>
    <br>
    <input type="text" name="studentid" id="studentid"
            placeholder="##-####-###" required>
    <br><br>

    <label for="fullname">Full Name:</label>
    <br>
    <input type="text" name="fullname" id="fullname"
            placeholder="Last Name, First Name M.I." required>
    <br><br>
    
    <label for="email">Email:</label>
    <br>
    <input type="email" name="email" id="email"
            placeholder="yourmom@email.com" required>
    <br><br>

    <label for="password">Password:</label>
    <br>
    <input type="password" name="password" id="password"
            placeholder="Enter your password: "
            minlength="8" maxlength="20" required>
    <br><br>

    <label for="gender">Gender:</label>
    <br>
    <input type="radio" name="gender" id="male" value="Male" required>
    <label for="male">Male</label>

    <input type="radio" name="gender" id="female" value="Female" required>
    <label for="female">Female</label>

    <input type="radio" name="gender" id="other" value="Other" required>
    <label for="other">Other</label>
    <br><br>

    <label for="course">Course:</label>
    <br>
    <input type="radio" name="course" id="BSCS" value="BSCS" required>
    <label for="BSIT">BSCS</label>
    <br>
    <input type="radio" name="course" id="BSIT" value="BSIT" required>
    <label for="BSIT">BSIT</label>
    <br>
    <input type="radio" name="course" id="BSDA" value="BSDA" required>
    <label for="BSDA">BSDA</label>
    <br>
    <input type="radio" name="course" id="BMMA" value="BMMA" required>
    <label for="BMMA">BMMA</label>
    <br><br>

    <label for="hobbies">Hobbies:</label>
    <br>
    <textarea name="hobbies" id="hobbies" required
    placeholder="Any Hobby/s"></textarea>
    <br><br>

    <label for="address">Address:</label>
    <br>
    <textarea name="address" id="address" required
    placeholder="Your Current Address"></textarea>

    <br><br>
    <button type="submit">Submit</button>

</body>
</html>
